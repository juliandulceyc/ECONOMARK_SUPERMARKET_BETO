# Redirige HTTP a HTTPS
server {
    listen 80;
    server_name supermarketbeto.duckdns.org;
    return 301 https://$host$request_uri;
}

# Servir frontend y proxy backend por HTTPS
server {
    listen 443 ssl;
    server_name supermarketbeto.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/supermarketbeto.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supermarketbeto.duckdns.org/privkey.pem;

    root /usr/share/nginx/html; # Cambia si tu build está en otra ruta
    index index.html;

    # Proxy para el backend API
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy para Swagger (si lo usas)
    location /api-docs/ {
        proxy_pass http://backend:3000/api-docs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (React/Vite)
    location / {
        try_files $uri /index.html;
    }
}