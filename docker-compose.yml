version: "3.8"
services:
  db:
    image: mysql:8
    container_name: economark-mysql
    restart: always
    env_file:
      - ./backend/.env.db
    ports:
      - "3307:3306"
    volumes:
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: economark-backend
    restart: always
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    working_dir: /app
    #volumes:
      #- ./backend:/app
     # - /app/node_modules  
     # 

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: economark-frontend
    restart: always
    ports:
      - "5173:80"

volumes:
  db_data: