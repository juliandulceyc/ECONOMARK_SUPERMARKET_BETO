version: "3.8"
services:
  db:
    image: mysql:8
    container_name: economark-mysql
    restart: always
    env_file:
      - .env
    ports:
      - "3307:3306"
    volumes:
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: dulceydev/economark-backend:latest
    container_name: economark-backend
    restart: always
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    working_dir: /app
    # Si necesitas montar el código local para desarrollo, descomenta la siguiente línea:
    # volumes:
    #   - ./backend:/app

  frontend:
    image: dulceydev/economark-frontend:latest
    container_name: economark-frontend
    restart: always
    ports:
      - "5173:80"
    # Si necesitas montar el código local para desarrollo, descomenta la siguiente línea:
    # volumes:
    #   - ./frontend:/usr/share/nginx/html

volumes:
  db_data: