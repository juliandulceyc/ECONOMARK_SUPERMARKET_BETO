# Redirige todo el tráfico HTTP a HTTPS
server {
    listen 80;
    server_name supermarketbeto.duckdns.org;
    return 301 https://$host$request_uri;
}

# Servidor HTTPS
server {
    listen 443 ssl;
    server_name supermarketbeto.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/supermarketbeto.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supermarketbeto.duckdns.org/privkey.pem;

    # Proxy para el backend (ajusta el puerto si es diferente)
    location /api/ {
        proxy_pass http://localhost:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy para Swagger (si lo usas)
    location /api-docs/ {
        proxy_pass http://localhost:3000/api-docs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy para el frontend (contenedor en el puerto 8080)
    location / {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}